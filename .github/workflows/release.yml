# 发布（CD）：develop 合入 main 后，在 Windows runner 上打包 NSIS 安装包并创建 Release
#
# 触发：
#   push 到 main —— 每次从 develop 同步合入的发布提交都会发布一个新版本
#   workflow_dispatch —— 只验证打包链路；只有从 main 手动触发时才创建 Release
#
# 版本规则：
#   版本号必须在 develop 的短分支里升好（package.json 与 package-lock.json 一起），
#   这里先查同名 tag / Release 是否已存在，已存在就直接失败，避免重复发布。
#   不要在 main 上改版本，也不要手工推 tag —— tag 由 gh release create --target 创建。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 创建 tag / Release / 上传附件需要

concurrency:
  # 发布不能并发：排队执行，避免两个 main 推送抢同一个版本号
  group: release-main
  cancel-in-progress: false

jobs:
  windows-installer:
    name: 打包并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 读取版本并检查是否已发布
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "准备发布 $tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::版本 $version 已经发布过：每次 develop → main 都必须先在 develop 升版本"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag 已存在但没有对应 Release，请检查是否手工推过 tag"
            exit 1
          fi

      # 根依赖 = Electron + electron-builder（应用清单在仓库根）
      - name: 安装应用依赖
        run: npm ci

      # 服务依赖会被一起打进安装包（见 package.json 的 build.files）
      - name: 安装服务依赖
        working-directory: server
        run: npm ci

      # main 上的合并提交不再经过 PR，发布前用全量回归兜住合并冲突引入的问题
      - name: 发布前全量回归
        shell: bash
        run: |
          cd server
          npm test

      # 图标 assets/icon.png 已入库，CI 不需要再跑 make:icon（那需要 GUI 渲染）
      - name: 打包（NSIS 安装包）
        run: npm run dist

      - name: 收集产物
        shell: bash
        run: ls -lh release/*.exe release/*.blockmap release/*.yml 2>/dev/null || ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: 创建 tag 与 Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$TAG" \
            release/*.exe \
            release/*.blockmap \
            release/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Orbit 星账 $TAG" \
            --generate-notes
