# 发布（CD）：develop 合入 main 后，同时打包 Windows exe 与 Linux deb/rpm 并创建 Release
#
# 触发：
#   push 到 main —— 每次从 develop 同步合入的发布提交都会发布一个新版本
#   workflow_dispatch —— 只验证打包链路；只有从 main 手动触发时才创建 Release
#
# 版本规则：
#   版本号必须在 develop 的短分支里升好（package.json 与 package-lock.json 一起），
#   prepare 先查同名 tag / Release 是否已存在，已存在就直接失败，避免重复发布。
#   不要在 main 上改版本，也不要手工推 tag —— tag 由 gh release create --target 创建。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 创建 tag / Release / 上传附件需要

concurrency:
  # 发布不能并发：排队执行，避免两个 main 推送抢同一个版本号
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验发布版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 读取版本并检查是否已发布
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "准备发布 $tag"

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "非 main 手动触发：跳过已发布检查，只验证打包"
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::版本 $version 已经发布过：每次 develop → main 都必须先在 develop 升版本"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag 已存在但没有对应 Release，请检查是否手工推过 tag"
            exit 1
          fi

  regression:
    name: 发布前全量回归
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装应用依赖
        run: npm ci

      - name: 安装服务依赖
        working-directory: server
        run: npm ci

      # main 上的合并提交不再经过 PR，发布前用全量回归兜住合并冲突引入的问题
      - name: 全量回归
        working-directory: server
        run: npm test

  windows-installer:
    name: Windows 安装包
    needs: [prepare, regression]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # 根依赖 = Electron + electron-builder（应用清单在仓库根）
      - name: 安装应用依赖
        run: npm ci

      # 服务依赖会被一起打进安装包（见 package.json 的 build.files）
      - name: 安装服务依赖
        working-directory: server
        run: npm ci

      - name: 打包（NSIS 安装包）
        run: npm run dist:win

      - name: 收集产物
        shell: bash
        run: ls -lh release/*.exe release/*.blockmap release/*.yml 2>/dev/null || ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  linux-installer:
    name: Linux 安装包
    needs: [prepare, regression]
    runs-on: ubuntu-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 安装应用依赖
        run: npm ci

      - name: 安装服务依赖
        working-directory: server
        run: npm ci

      # CI 的 npm ci 不会稳定执行 Electron postinstall；显式准备本地 Electron dist，
      # 供 electron-builder 的 electronDist 使用，避免下载 Electron zip。
      - name: 准备 Electron 运行库
        run: node node_modules/electron/install.js

      - name: 安装 rpmbuild 与 7zip
        run: sudo apt-get update && sudo apt-get install -y rpm p7zip-full

      # fpm 的 .7z 由 electron-builder 下载后还要再下 7zip 解包；直接预解，绕开 504
      - name: 准备 fpm
        shell: bash
        run: |
          set -e
          FPM_URL="https://github.com/electron-userland/electron-builder-binaries/releases/download/fpm@2.1.4/fpm-1.17.0-ruby-3.4.3-linux-amd64.7z"
          curl -fL --retry 5 --retry-delay 5 -o /tmp/fpm.7z "$FPM_URL"
          rm -rf /tmp/fpm && mkdir -p /tmp/fpm
          7z x -y -o/tmp/fpm /tmp/fpm.7z >/dev/null
          FPM_BIN="$(find /tmp/fpm -maxdepth 2 -type f -name fpm | head -1)"
          test -n "$FPM_BIN"
          chmod +x "$FPM_BIN"
          echo "CUSTOM_FPM_PATH=$FPM_BIN" >> "$GITHUB_ENV"

      - name: 内嵌服务冒烟（无需 GUI）
        run: npm run verify:linux

      - name: 打包（deb + rpm）
        shell: bash
        run: |
          export ELECTRON_BUILDER_7ZIP_PATH="$(command -v 7zz || command -v 7z || command -v 7za)"
          npm run dist:linux

      - name: 检查产物
        run: |
          set -e
          ls -lh release/*.deb release/*.rpm
          for f in release/*.deb; do dpkg-deb --info "$f" >/dev/null; done
          for f in release/*.rpm; do
            test -f "$f"
            file "$f" | grep -qi 'RPM'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-installer
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  publish:
    name: 创建 Release
    needs: [prepare, windows-installer, linux-installer]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 检查各平台产物
        run: |
          set -e
          ls -lh release-assets
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.rpm' -print -quit)"

      - name: 创建 tag 与 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Orbit 星账 ${{ needs.prepare.outputs.tag }}" \
            --generate-notes
