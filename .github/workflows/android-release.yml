name: Android Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: 签名 AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 构建 webapp
        run: |
          npm ci
          npm run build:web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 使用 runner 预装 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: 同步 Capacitor
        run: |
          npm ci --prefix mobile
          cd mobile
          npx cap sync android
      - name: 解码 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "缺少 ANDROID_KEYSTORE_BASE64"; exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/orbit-release.keystore
      - name: 签名构建
        env:
          ORBIT_KEYSTORE_FILE: ${{ github.workspace }}/mobile/orbit-release.keystore
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ORBIT_KEYSTORE_PASSWORD" && test -n "$ORBIT_KEY_ALIAS" && test -n "$ORBIT_KEY_PASSWORD" || (echo "缺少签名 secrets"; exit 1)
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
