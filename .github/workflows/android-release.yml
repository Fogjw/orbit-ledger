name: Android Signed Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: 签名 AAB/APK 并挂 Release
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 读取版本并校验 Android 版本
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ANDROID_VERSION="$(grep -oP 'versionName "\K[^"]+' mobile/android/app/build.gradle)"
          test "$VERSION" = "$ANDROID_VERSION" || (echo "package=$VERSION android=$ANDROID_VERSION 不一致"; exit 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: 构建 webapp
        run: |
          npm ci
          npm run build:web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 使用 runner 预装 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: 同步 Capacitor
        run: |
          npm ci --prefix mobile
          cd mobile
          npx cap sync android
      - name: 解码 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "缺少 ANDROID_KEYSTORE_BASE64"; exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/orbit-release.keystore
      - name: 签名构建
        env:
          ORBIT_KEYSTORE_FILE: ${{ github.workspace }}/mobile/orbit-release.keystore
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ORBIT_KEYSTORE_PASSWORD" && test -n "$ORBIT_KEY_ALIAS" && test -n "$ORBIT_KEY_PASSWORD" || (echo "缺少签名 secrets"; exit 1)
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-release
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: 挂到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null
          mkdir -p release-assets
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release-assets/Orbit-Android-${VERSION}.apk"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "release-assets/Orbit-Android-${VERSION}.aab"
          (cd release-assets && sha256sum "Orbit-Android-${VERSION}.apk" "Orbit-Android-${VERSION}.aab" > "Orbit-Android-${VERSION}.sha256")
          gh release upload "$TAG" release-assets/* --clobber
          echo "已上传 Android 资产到 $TAG"
