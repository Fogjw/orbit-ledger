<!-- 浏览器标签页图标。
     与 assets/icon.svg（桌面端安装包图标）是同一套图形，但针对 16px 的显示尺寸做了简化：
     细线条在标签栏上会糊成一团，所以这里轨道只留一根且加粗、主体放大、去掉外圈柔光，
     并自带深色圆角底 —— 透明底的浅蓝线条在浅色标签栏上看不清。
     改图形时两处一起改。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Orbit">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#101a38"/>
      <stop offset="100%" stop-color="#030510"/>
    </radialGradient>
    <radialGradient id="favCore" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#9be9ff"/>
      <stop offset="100%" stop-color="#2f6fe0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>
  <g transform="translate(16 16) scale(1.3) translate(-16 -16)">
    <ellipse cx="16" cy="16" rx="13" ry="6.5" fill="none" stroke="rgba(150,200,255,.75)" stroke-width="2" transform="rotate(-18 16 16)"/>
    <circle cx="16" cy="16" r="5.5" fill="url(#favCore)"/>
    <circle cx="26" cy="10" r="2" fill="#fff"/>
  </g>
</svg>
