<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit 星账 · 星空 Demo</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 深空背景 -->
  <canvas id="bg"></canvas>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="vignette"></div>

  <!-- 主图谱 -->
  <canvas id="graph"></canvas>

  <!-- 顶部工具栏 -->
  <header class="topbar glass">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <defs>
            <radialGradient id="lg" cx="40%" cy="35%" r="80%">
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="35%" stop-color="#9be9ff"/>
              <stop offset="100%" stop-color="#2f6fe0" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <ellipse cx="16" cy="16" rx="13" ry="6.5" fill="none" stroke="rgba(140,190,255,.55)" stroke-width="1.2" transform="rotate(-18 16 16)"/>
          <ellipse cx="16" cy="16" rx="13" ry="6.5" fill="none" stroke="rgba(140,190,255,.18)" stroke-width="4" transform="rotate(-18 16 16)"/>
          <circle cx="16" cy="16" r="5" fill="url(#lg)"/>
          <circle cx="26" cy="10" r="1.6" fill="#fff"/>
          <circle cx="7" cy="22" r="1.1" fill="#bcd6ff" opacity=".8"/>
        </svg>
      </span>
      <span class="brand-text">Orbit <em>星账</em></span>
      <span class="badge">DEMO</span>
    </div>

    <div class="ledger-dd">
      <button class="btn ghost led-btn" id="ledgerBtn" title="切换账本">◈ 生活费 ▾</button>
      <div class="dd-menu glass" id="ledgerMenu" hidden></div>
    </div>
    <button class="btn ghost seg-add" id="btnAddLedger" title="新建账本">＋账本</button>

    <div class="segment" id="dimSeg">
      <button class="seg active" data-v="category">品类</button>
      <button class="seg" data-v="context">情境</button>
    </div>

    <button class="btn ghost" id="btnToday" title="回到今天">◉ 回到今天</button>
    <button class="btn back" id="btnBack" hidden>← 主视图</button>

    <div class="spacer"></div>

    <div class="month-total" id="monthTotal">
      <span class="mt-label" id="mtLabel">6月 · 共 32 笔</span>
      <span class="mt-value" id="mtValue">¥1,905</span>
    </div>

    <button class="btn primary" id="btnAdd">＋ 记一笔</button>
  </header>

  <!-- 左侧洞察面板 -->
  <aside class="panel glass" id="insightPanel">
    <div class="p-title">本月星图 <span class="live-dot"></span></div>
    <div class="p-total">
      <div class="p-num" id="pNum">¥1,905</div>
      <div class="p-sub"><span class="chip up" id="pDelta">▲ 8.2% vs 上月</span><span class="p-count" id="pCount">32 笔 · 日均 ¥64</span></div>
    </div>
    <div class="p-sec">TOP 分类</div>
    <div id="topList"></div>
    <div class="p-sec">交叉洞察</div>
    <div class="insight" id="insightBox">✨ <b>和朋友</b> 的聚餐占餐饮 <b>62%</b>，娱乐多与朋友同行。</div>
  </aside>

  <!-- 右侧粒度轨 -->
  <div class="rail-wrap glass" id="railWrap" title="星轨变焦：上=日 下=年（可拖动，滚轮亦可）">
    <span class="rail-mark">日</span>
    <div class="rail" id="rail">
      <div class="rail-glow"></div>
      <div class="rail-handle" id="railHandle"></div>
    </div>
    <span class="rail-mark">年</span>
  </div>

  <!-- 底部星轨 -->
  <footer class="timeline glass">
    <div class="tl-head">
      <span class="tl-title">星轨 · 时间</span>
      <span class="tl-tip" id="tlTip">点击星星切换月份</span>
    </div>
    <canvas id="orbit"></canvas>
  </footer>

  <div class="hint">拖拽星体 · 悬停看关联 · 点击星星下钻 · 滚轮缩放星轨 · 星轨可左右拖</div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <!-- 记一笔浮层 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal glass">
      <div class="m-head">
        <span class="n-title" id="modalMode">记一笔</span>
        <div class="m-tabs"><button class="m-tab active">支出</button><button class="m-tab">收入</button></div>
        <button class="m-close" id="modalClose">✕</button>
      </div>
      <div class="m-amount"><span>¥</span><input id="mAmount" value="88" inputmode="decimal" /></div>
      <div class="m-label">品类 <button class="chip-add" id="btnAddCat" title="新建品类 tag">＋ 新建</button></div>
      <div class="m-chips" id="mCats"></div>
      <!-- 副 tag（细分）：选中主 tag 后出现，可多选；切换主 tag 会清空 -->
      <div class="m-subwrap" id="mCatsSub" hidden>
        <div class="m-sub-head">
          <span class="m-sub-label" id="mCatsSubLabel"></span>
          <button class="chip-add" id="mCatsSubAdd" title="在该主 tag 下新建细分 tag">＋ 新建细分</button>
        </div>
        <div class="m-chips" id="mCatsSubChips"></div>
      </div>
      <div class="m-label">情境 <button class="chip-add" id="btnAddCtx" title="新建情境 tag">＋ 新建</button></div>
      <div class="m-chips" id="mCtx"></div>
      <div class="m-subwrap" id="mCtxSub" hidden>
        <div class="m-sub-head">
          <span class="m-sub-label" id="mCtxSubLabel"></span>
          <button class="chip-add" id="mCtxSubAdd" title="在该主 tag 下新建细分 tag">＋ 新建细分</button>
        </div>
        <div class="m-chips" id="mCtxSubChips"></div>
      </div>
      <div class="m-row">
        <label>日期 <input type="date" value="2026-06-14" class="m-input" /></label>
        <label>账本 <select class="m-input"><option>生活费</option><option>私人</option></select></label>
      </div>
      <input class="m-input m-remark" placeholder="备注…（例如：和朋友吃火锅）" />
      <div class="m-foot">
        <button class="btn ghost" id="modalCancel">取消</button>
        <button class="btn primary" id="modalSave">保存 · 点亮一颗星</button>
      </div>
    </div>
  </div>

  <!-- 命名浮层（新建账本 / 新建 tag 共用） -->
  <div class="modal-mask" id="nameMask" hidden>
    <div class="modal glass n-modal">
      <div class="m-head">
        <span class="n-title" id="nameTitle">新建</span>
        <button class="m-close" id="nameClose">✕</button>
      </div>
      <input class="m-input" id="nameInput" placeholder="名称…" maxlength="20" />
      <div class="m-foot">
        <button class="btn ghost" id="nameCancel">取消</button>
        <button class="btn primary" id="nameOk">创建</button>
      </div>
    </div>
  </div>

  <!-- 花销明细浮层（点品类主星：本月该品类逐笔 + 删除） -->
  <div class="modal-mask" id="expMask" hidden>
    <div class="modal glass e-modal">
      <div class="m-head">
        <span class="n-title" id="expTitle">花销明细</span>
        <div class="e-head-actions">
          <button class="chip-add" id="expRenameTag">✎ 重命名</button>
          <button class="m-close" id="expClose">✕</button>
        </div>
      </div>
      <div class="e-sub" id="expSub"></div>
      <!-- L3：该分类内部的细分分布（本月花销按副 tag 聚合） -->
      <div class="e-dist" id="expDist" hidden>
        <div class="d-head">细分分布</div>
        <div class="d-rows" id="expDistRows"></div>
        <div class="d-tip" id="expDistTip" hidden>一笔可挂多个细分，占比之和可能超过 100%</div>
      </div>
      <div class="e-list" id="expList"></div>
      <div class="m-foot e-foot">
        <button class="btn danger" id="expDelTag">删除此 tag</button>
        <div class="spacer"></div>
        <button class="btn primary" id="expDone">完成</button>
      </div>
    </div>
  </div>

<script src="api.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
