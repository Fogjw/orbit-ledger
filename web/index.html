<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit 星账</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 深空背景 -->
  <canvas id="bg"></canvas>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="vignette"></div>

  <!-- 主图谱 -->
  <canvas id="graph"></canvas>

  <!-- 顶部工具栏 -->
  <header class="topbar glass">
    <div class="brand">
      <!-- 应用 logo：与桌面端窗口/安装包图标同一份图形（web/logo.svg），不再各处内联 -->
      <span class="logo"><img src="logo.svg" alt="Orbit" width="26" height="26" /></span>
      <span class="brand-text">Orbit <em>星账</em></span>
    </div>

    <div class="ledger-dd">
      <button class="btn ghost led-btn" id="ledgerBtn" title="切换账本">◈ 生活费 ▾</button>
      <div class="dd-menu glass" id="ledgerMenu" hidden></div>
    </div>

    <div class="segment" id="dimSeg">
      <button class="seg active" data-v="category">品类</button>
      <button class="seg" data-v="context">情境</button>
    </div>

    <button class="btn ghost" id="btnToday" title="回到今天">◉ 回到今天</button>
    <button class="btn back" id="btnBack" hidden>← 主视图</button>

    <div class="spacer"></div>

    <div class="month-total" id="monthTotal">
      <span class="mt-label" id="mtLabel">6月 · 共 32 笔</span>
      <span class="mt-value" id="mtValue">¥1,905</span>
    </div>

    <button class="btn primary" id="btnAdd">＋ 记一笔</button>
  </header>

  <!-- 左侧洞察面板 -->
  <aside class="panel glass" id="insightPanel">
    <div class="p-title"><span id="pTitle">本月星图</span> <span class="live-dot"></span></div>
    <div class="p-total">
      <div class="p-balance"><span class="p-key">结余</span><span class="p-num" id="pNum">¥0</span></div>
      <div class="p-sub"><span class="p-key">支出</span><span class="p-val p-exp" id="pExp">¥0</span><span class="chip up" id="pDelta">▲ 8.2%</span></div>
      <div class="p-sub"><span class="p-key">收入</span><span class="p-val p-inc" id="pInc">¥0</span></div>
      <div class="p-count" id="pCount">0 天有记录 · 日均支出 ¥0</div>
    </div>
    <div class="p-sec">TOP 分类</div>
    <div id="topList"></div>
    <div class="p-sec">交叉洞察</div>
    <div class="insight" id="insightBox">✨ <b>和朋友</b> 的聚餐占餐饮 <b>62%</b>，娱乐多与朋友同行。</div>
  </aside>

  <!-- 右侧粒度轨 -->
  <div class="rail-wrap glass" id="railWrap" title="星轨变焦：上=日 下=年（可拖动，滚轮亦可）">
    <span class="rail-mark">日</span>
    <div class="rail" id="rail">
      <div class="rail-glow"></div>
      <div class="rail-handle" id="railHandle"></div>
    </div>
    <span class="rail-mark">年</span>
  </div>

  <!-- 底部星轨 -->
  <footer class="timeline glass">
    <div class="tl-head">
      <span class="tl-title">星轨 · 时间</span>
      <span class="tl-tip" id="tlTip">点击星星切换月份</span>
    </div>
    <canvas id="orbit"></canvas>
  </footer>

  <div class="hint">拖拽星体 · 悬停看关联 · 点击星星下钻 · 滚轮缩放星轨 · 星轨可左右拖</div>

  <!-- 画布缩放条（滚轮已用于星轨的年/月/日切换，故画布缩放走显式控件） -->
  <div class="zoom-bar glass" id="zoomBar">
    <button class="zb-btn" id="zoomOut" title="缩小画布">－</button>
    <input type="range" id="zoomRange" min="0.4" max="2.6" step="0.02" value="1" aria-label="画布缩放" />
    <button class="zb-btn" id="zoomIn" title="放大画布">＋</button>
    <span class="zb-val" id="zoomVal">100%</span>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <!-- 记一笔浮层 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal glass">
      <div class="m-head">
        <span class="n-title" id="modalMode">记一笔</span>
        <div class="m-tabs"><button class="m-tab active">支出</button><button class="m-tab">收入</button></div>
        <button class="m-close" id="modalClose">✕</button>
      </div>
      <div class="m-amount"><span>¥</span><input id="mAmount" value="88" inputmode="decimal" /></div>
      <div class="m-label">品类 <button class="chip-add" id="btnAddCat" title="新建品类 tag">＋ 新建</button></div>
      <div class="m-chips" id="mCats"></div>
      <!-- 副 tag（细分）：选中主 tag 后出现，可多选；切换主 tag 会清空 -->
      <div class="m-subwrap" id="mCatsSub" hidden>
        <div class="m-sub-head">
          <span class="m-sub-label" id="mCatsSubLabel"></span>
          <button class="chip-add" id="mCatsSubAdd" title="在该主 tag 下新建细分 tag">＋ 新建细分</button>
        </div>
        <div class="m-chips" id="mCatsSubChips"></div>
      </div>
      <div class="m-label" id="mCtxLabel">情境 <button class="chip-add" id="btnAddCtx" title="新建情境 tag">＋ 新建</button></div>
      <div class="m-chips" id="mCtx"></div>
      <div class="m-subwrap" id="mCtxSub" hidden>
        <div class="m-sub-head">
          <span class="m-sub-label" id="mCtxSubLabel"></span>
          <button class="chip-add" id="mCtxSubAdd" title="在该主 tag 下新建细分 tag">＋ 新建细分</button>
        </div>
        <div class="m-chips" id="mCtxSubChips"></div>
      </div>
      <div class="m-row">
        <label>日期 <input type="date" value="2026-06-14" class="m-input" /></label>
        <label>账本 <select class="m-input"><option>生活费</option><option>私人</option></select></label>
      </div>
      <textarea class="m-input m-remark" id="mNote" rows="3" placeholder="备注…（可写多行；Ctrl/Cmd+Enter 保存）"></textarea>
      <div class="m-foot">
        <button class="btn ghost" id="modalCancel">取消</button>
        <button class="btn primary" id="modalSave">保存 · 点亮一颗星</button>
      </div>
    </div>
  </div>

  <!-- 命名浮层（新建账本 / 新建 tag 共用） -->
  <div class="modal-mask" id="nameMask" hidden>
    <div class="modal glass n-modal">
      <div class="m-head">
        <span class="n-title" id="nameTitle">新建</span>
        <button class="m-close" id="nameClose">✕</button>
      </div>
      <input class="m-input" id="nameInput" placeholder="名称…" maxlength="20" />
      <!-- tag 取色（新建/重命名 tag 时显示；不选则用按名哈希的默认色） -->
      <div class="n-colors" id="nameColors" hidden>
        <div class="nc-head">
          <span class="nc-label">标签颜色</span>
          <button class="chip-add" id="ncDefault" title="不指定，按名称自动取色">自动</button>
        </div>
        <div class="nc-swatches" id="ncSwatches"></div>
        <label class="nc-custom">自定义 <input type="color" id="ncCustom" value="#5ad7ff" /></label>
      </div>
      <div class="m-foot">
        <button class="btn ghost" id="nameCancel">取消</button>
        <button class="btn primary" id="nameOk">创建</button>
      </div>
    </div>
  </div>

  <!-- 账单详情（显示视图）：只读，看金额/日期/账本/关联标签/备注；编辑才进完整浮层 -->
  <div class="modal-mask" id="viewMask" hidden>
    <div class="modal glass v-modal">
      <div class="m-head">
        <span class="n-title">账单详情</span>
        <button class="m-close" id="viewClose">✕</button>
      </div>
      <div class="v-amount" id="viewAmount">¥0</div>
      <div class="v-rows">
        <div class="v-row"><span>日期</span><b id="viewDate"></b></div>
        <div class="v-row"><span>账本</span><b id="viewLedger"></b></div>
        <div class="v-row"><span>类型</span><b id="viewType"></b></div>
      </div>
      <div class="v-sec">关联标签</div>
      <div class="v-tags" id="viewTags"></div>
      <div class="v-sec">备注</div>
      <div class="v-note" id="viewNote"></div>
      <div class="m-foot">
        <button class="btn danger" id="viewDel">删除</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="viewClose2">关闭</button>
        <button class="btn primary" id="viewEdit">编辑</button>
      </div>
    </div>
  </div>

  <!-- 花销明细浮层（点品类主星：本月该品类逐笔 + 删除） -->
  <div class="modal-mask" id="expMask" hidden>
    <div class="modal glass e-modal">
      <div class="m-head">
        <span class="n-title" id="expTitle">花销明细</span>
        <div class="e-head-actions">
          <button class="chip-add" id="expRenameTag">✎ 重命名</button>
          <button class="chip-add" id="expRecolorTag">◐ 改色</button>
          <button class="m-close" id="expClose">✕</button>
        </div>
      </div>
      <div class="e-colors" id="expColors" hidden>
        <div class="nc-head">
          <span class="nc-label">标签颜色</span>
          <button class="chip-add" id="expColorDefault" title="清除覆盖色，回到按名称自动取色">自动</button>
        </div>
        <div class="nc-swatches" id="expSwatches"></div>
        <label class="nc-custom">自定义 <input type="color" id="expCustom" value="#5ad7ff" /></label>
      </div>
      <div class="e-sub" id="expSub"></div>
      <!-- L3：该分类内部的细分分布（本月花销按副 tag 聚合） -->
      <div class="e-dist" id="expDist" hidden>
        <div class="d-head">细分分布</div>
        <div class="d-rows" id="expDistRows"></div>
        <div class="d-tip" id="expDistTip" hidden>一笔可挂多个细分，占比之和可能超过 100%</div>
      </div>
      <div class="e-list" id="expList"></div>
      <div class="m-foot e-foot">
        <button class="btn danger" id="expDelTag">删除此 tag</button>
        <div class="spacer"></div>
        <button class="btn primary" id="expDone">完成</button>
      </div>
    </div>
  </div>

  <!-- 标签管理浮层（排序 / 重命名）：顺序即 tags.position，影响记一笔候选与星图节点排布 -->
  <div class="modal-mask" id="tagMask" hidden>
    <div class="modal glass t-modal">
      <div class="m-head">
        <span class="n-title">标签管理</span>
        <div class="segment" id="tagDimSeg">
          <button class="seg active" data-v="category">品类</button>
          <button class="seg" data-v="context">情境</button>
        </div>
        <button class="m-close" id="tagClose">✕</button>
      </div>
      <div class="t-tip">用 ↑ ↓ 调整顺序 · 顺序影响记一笔的候选排列与星图节点顺序</div>
      <div class="t-list" id="tagList"></div>
      <div class="m-foot">
        <button class="btn primary" id="tagDone">完成</button>
      </div>
    </div>
  </div>

<script src="api.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
